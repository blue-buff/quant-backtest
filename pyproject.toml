[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qbt"
version = "0.1.0"
description = "A股/港股量化回测流水线 CLI：数据导出→qlib训练→调仓计划→真实规则回测→报告"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pyyaml",
    "pandas",
]

[project.scripts]
qbt = "qbt.cli:app"

[tool.setuptools]
packages = ["qbt", "qbt.commands"]
