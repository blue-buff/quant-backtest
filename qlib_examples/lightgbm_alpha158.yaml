qlib_init:
    provider_uri: "~/.qlib/qlib_data/cn_data"
    region: cn
market: &market csi300
benchmark: &benchmark SH000300
data_handler_config: &data_handler_config
    start_time: 2023-01-01
    end_time: 2026-08-14
    fit_start_time: 2023-01-01
    fit_end_time: 2024-06-30
    instruments: *market
    learn_processors:
      - class: DropnaLabel
        module_path: qlib.data.dataset.processor
      - class: RobustZScoreNorm
        module_path: qlib.data.dataset.processor
      - class: DropnaProcessor
        module_path: qlib.data.dataset.processor
    infer_processors:
      - class: RobustZScoreNorm
        module_path: qlib.data.dataset.processor
      - class: DropnaProcessor
        module_path: qlib.data.dataset.processor
port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 50
            n_drop: 5
            only_tradable: true
    backtest:
        start_time: 2026-01-01
        end_time: 2026-08-13
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            # P2-2: top50 含 20% 涨跌幅板块（688xxx/300xxx/301xxx），0.095 只覆盖主板
            limit_threshold: 0.195
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5
task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.2
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 8
            num_leaves: 210
            num_threads: 20
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2023-01-01, 2024-06-30]
                valid: [2024-07-01, 2024-12-31]
                test: [2026-01-01, 2026-08-13]
    record: 
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            config: *port_analysis_config
